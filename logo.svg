<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="14%" r="45%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="18%" cy="88%" r="38%">
      <stop offset="0%" stop-color="#1A3560" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1A3560" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD07A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0A1628"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow2)"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="512" x2="1024" y2="512" stroke="#FFFFFF" stroke-width="0.5" opacity="0.03"/>
  <line x1="512" y1="0" x2="512" y2="1024" stroke="#FFFFFF" stroke-width="0.5" opacity="0.03"/>

  <!-- Logomark: gold rounded square -->
  <rect x="322" y="128" width="380" height="380" rx="72" fill="url(#markShine)" filter="url(#shadow)"/>

  <!-- Inner shadow on logomark top edge -->
  <rect x="322" y="128" width="380" height="380" rx="72"
        fill="none" stroke="#FFE0A0" stroke-width="2" opacity="0.5"/>

  <!-- G letterform — navy, bold, centered in mark -->
  <text
    x="512" y="333"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="248"
    font-weight="900"
    fill="#0A1628"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-4">G</text>

  <!-- Divider between mark and wordmark -->
  <rect x="287" y="545" width="450" height="2" rx="1" fill="#F5A623" opacity="0.25"/>

  <!-- Wordmark: GRAFT -->
  <text
    x="512" y="640"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="108"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-3">GRAFT</text>

  <!-- Wordmark: DIGITAL -->
  <text
    x="512" y="740"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="54"
    font-weight="300"
    fill="#F5A623"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="20">DIGITAL</text>

  <!-- Thin rule -->
  <rect x="362" y="800" width="300" height="1" rx="0.5" fill="#FFFFFF" opacity="0.08"/>

  <!-- London tagline -->
  <text
    x="512" y="860"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="10"
    opacity="0.28">LONDON</text>

</svg>
